<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление БД</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="user-panel">
        {% if current_user %}
            <span>👋 Привет, {{ current_user.name }}!</span>
            <a href="/">🏠 Главная</a>
        {% else %}
            <a href="/">🏠 Главная</a>
        {% endif %}
    </div>
    <div class="container mt-4">
        <h2>Управление базой данных</h2>

        <div class="card mt-3">
            <div class="card-header">Экспорт</div>
            <div class="card-body">
                <a href="/export-database" class="btn btn-outline-primary">Экспорт в JSON</a>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">Импорт</div>
            <div class="card-body">
                <form id="importForm" enctype="multipart/form-data">
                    <input type="file" class="form-control mb-2" name="file" accept=".json" required>
                    <button type="submit" class="btn btn-outline-success">Импорт из JSON</button>
                </form>
                <div id="importResult" class="mt-2"></div>
            </div>
        </div>

        <div class="card mt-3 border-danger">
            <div class="card-header bg-danger text-white">Удаление</div>
            <div class="card-body">
                <button id="deleteBtn" class="btn btn-danger">Удалить все данные</button>
                <div id="deleteResult" class="mt-2"></div>
            </div>
        </div>
    </div>

    <script>
        // Импорт
        document.getElementById('importForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const result = document.getElementById('importResult');
            result.innerHTML = '<div class="spinner-border spinner-border-sm"></div>';

            try {
                const response = await fetch('/import-database', {
                    method: 'POST',
                    body: new FormData(this)
                });
                result.innerHTML = response.ok ?
                    '<div class="text-success">Импорт успешен</div>' :
                    '<div class="text-danger">Ошибка импорта</div>';
            } catch (e) {
                result.innerHTML = '<div class="text-danger">Ошибка: ' + e.message + '</div>';
            }
        });

        // Удаление
        document.getElementById('deleteBtn').addEventListener('click', async function() {
            const result = document.getElementById('deleteResult');
            result.innerHTML = '<div class="spinner-border spinner-border-sm"></div>';

            try {
                const response = await fetch('/delete-database', { method: 'POST' });
                result.innerHTML = response.ok ?
                    '<div class="text-success">Данные удалены</div>' :
                    '<div class="text-danger">Ошибка удаления</div>';
            } catch (e) {
                result.innerHTML = '<div class="text-danger">Ошибка: ' + e.message + '</div>';
            }
        });
    </script>
</body>
</html>
